name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk bingo2playlist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bingo2playlist-apk
          path: bingo2playlist.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bingo2Playlist 1.0.${{ github.run_number }}
          make_latest: "true"
          files: bingo2playlist.apk
          body: |
            Side-load build. Download `bingo2playlist.apk` on your Android phone and open it to install.
            Always-current link: https://github.com/${{ github.repository }}/releases/latest/download/bingo2playlist.apk
